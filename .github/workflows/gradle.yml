name: Build Mod Manually

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    # === 关键修改：这一步会自动把腾讯云镜像替换成官方源 ===
    - name: Fix Gradle Mirror (Replace Tencent with Official)
      run: |
        # 将 gradle-wrapper.properties 里的腾讯云地址换成官方地址
        sed -i 's|mirrors.cloud.tencent.com/gradle|services.gradle.org/distributions|' gradle/wrapper/gradle-wrapper.properties
        # 顺便把 build.gradle 里可能存在的国内镜像源也替换掉（防止后面依赖下载也卡住）
        sed -i 's|maven.aliyun.com|repo1.maven.org/maven2|' build.gradle || true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle (Skip Tests)
      # 增加超时时间到 300秒，防止网络波动
      run: ./gradlew build -x test -x check -Dorg.gradle.internal.http.connectionTimeout=300000 -Dorg.gradle.internal.http.socketTimeout=300000
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: My-Mod-Jar-File
        path: build/libs/*.jar
        if-no-files-found: warn
